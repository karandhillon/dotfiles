# dracula — complete palette (single source of truth). Tool-agnostic:
# themify maps roles to tools; sketchybar colors.lua parses this at runtime.
# Palette source: Dracula — draculatheme.com/spec
# core
BG="#282a36"
BG_ALT="#21222c"
BG_SEL="#44475a"
FG="#f8f8f2"
FG_MUTED="#6272a4"
BORDER="#44475a"
ACCENT="#bd93f9"
ACCENT_2="#ff79c6"
# status — thresholds and failures only, not syntax
ERROR="#ff5555"
WARN="#ffb86c"
OK="#50fa7b"
INFO="#8be9fd"
# hues
RED="#ff5555"
GREEN="#50fa7b"
BLUE="#bd93f9"
YELLOW="#f1fa8c"
ORANGE="#ffb86c"
MAGENTA="#ff79c6"
CYAN="#8be9fd"
PURPLE="#bd93f9"
SAGE="#50fa7b"
ROSE="#ff79c6"
GOLD="#f1fa8c"
PEACH="#ffb86c"
TEAL="#8be9fd"
STEEL="#6272a4"
SHADOW="#191a21"
# surfaces (alpha layers are derived by consumers, not stored here)
HIGHLIGHT="#f8f8f2"
BG2="#44475a"
BAR_BORDER="#44475a"
POPUP_BG="#21222c"
