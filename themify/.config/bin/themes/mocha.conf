# mocha — complete palette (single source of truth). Tool-agnostic:
# themify maps roles to tools; sketchybar colors.lua parses this at runtime.
# Palette source: Catppuccin Mocha — catppuccin.com/palette
# core
BG="#1e1e2e"
BG_ALT="#181825"
BG_SEL="#313244"
FG="#cdd6f4"
FG_MUTED="#6c7086"
BORDER="#585b70"
ACCENT="#89b4fa"
