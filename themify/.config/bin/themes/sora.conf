# sora — complete palette (single source of truth). Tool-agnostic:
# themify maps roles to tools; sketchybar colors.lua parses this at runtime.
# core
BG="#0e1018"          # window/pane background
BG_ALT="#1e2430"      # secondary surface
BG_SEL="#1e2430"      # selection background
FG="#c8d0e0"          # primary text
FG_MUTED="#586478"    # dimmed text
BORDER="#2a3448"      # dividers, pane borders
ACCENT="#80C8E0"      # the theme's signature color
ACCENT_2="#B0A0D8"    # gradient partner (lavender)
# status — thresholds and failures only, not syntax
ERROR="#c46c78"       # failure
WARN="#d0a888"        # warning
OK="#90c8a0"          # healthy
INFO="#80c8e0"        # informational
# hues
RED="#c46c78"
GREEN="#90c8a0"
BLUE="#80c8e0"
YELLOW="#d4b878"
ORANGE="#d0a888"
MAGENTA="#b0a0d8"
CYAN="#80c8e0"
PURPLE="#b0a0d8"
SAGE="#90c8a0"
ROSE="#d0909c"
GOLD="#d4b878"
PEACH="#d0a888"
TEAL="#78b8b0"
STEEL="#8898b8"
SHADOW="#0a0c12"
# surfaces (alpha layers are derived by consumers, not stored here)
HIGHLIGHT="#8898b8"
BG2="#222838"
BAR_BORDER="#222838"
POPUP_BG="#14161e"
POPUP_BORDER="#586478"

# terminal ANSI slots (what ghostty emits; NOT always equal to the hue
# roles — e.g. cendre slot 0 is BG_ALT, slot 7 is FG_MUTED)
ANSI_0="#0e1018"
ANSI_1="#c46c78"
ANSI_2="#90c8a0"
ANSI_3="#d4b878"
ANSI_4="#80c8e0"
ANSI_5="#b0a0d8"
ANSI_6="#78b8b0"
ANSI_7="#c8d0e0"
ANSI_8="#4a5468"
ANSI_9="#d88898"
ANSI_10="#a8d8b4"
ANSI_11="#e0c888"
ANSI_12="#98d8f0"
ANSI_13="#c4b4e8"
ANSI_14="#90d0c8"
ANSI_15="#dce4f0"

# pi UI surface tints (consumed by themify/build.sh when generating pi themes)
MIST="#8a93a8"
BORDER_DIM="#2a3140"
SEARCH_BG="#242e44"
USER_MSG_BG="#151a2a"
CUSTOM_MSG_BG="#181d2e"
TOOL_PENDING_BG="#131724"
TOOL_SUCCESS_BG="#14221c"
TOOL_ERROR_BG="#241419"
BGREEN="#68a888"   # pi diff-added green (sora: hand-tuned darker than ANSI_10; cendre: == ANSI_10)
THINKING_OFF="#3a4254"
INFO_BG="#2a2416"
