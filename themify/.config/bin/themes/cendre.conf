# cendre — complete palette (single source of truth). Tool-agnostic:
# themify maps roles to tools; sketchybar colors.lua parses this at runtime.
# core
BG="#171311"          # window/pane background
BG_ALT="#201b19"      # secondary surface
BG_SEL="#2f1e17"      # selection background
FG="#e6d5c2"          # primary text
FG_MUTED="#a09384"    # dimmed text
BORDER="#463e3a"      # dividers, pane borders
ACCENT="#EA9875"      # the theme's signature color (ember)
ACCENT_2="#FCBA81"    # gradient partner (brass)
# status — diagnostics carry more chroma than any pigment, on purpose,
# so a failing widget never wears the same red as a keyword
ERROR="#d25780"       # failure
WARN="#f4a21c"        # warning
OK="#43b16a"          # healthy
INFO="#58bdff"        # informational
# hues — the five pigments under familiar names (frost/potassium/sap/cinder/brass/ember)
RED="#d1766e"         # cinder
GREEN="#99af6b"       # sap
BLUE="#58bdff"
YELLOW="#fcba81"      # brass
ORANGE="#ea9875"      # ember
MAGENTA="#9480ba"     # potassium
CYAN="#4e89a2"        # frost — the palette's only cool pigment (NOT blue: that's semantic.info)
PURPLE="#9480ba"      # potassium
SAGE="#99af6b"        # sap
ROSE="#d1766e"        # cinder
GOLD="#fcba81"        # brass
PEACH="#ea9875"       # ember
TEAL="#4e89a2"        # frost
STEEL="#a09384"       # fg_dim
SHADOW="#0f0c0a"
# surfaces (alpha layers are derived by consumers, not stored here)
HIGHLIGHT="#e6d5c2"
BG2="#2a2422"
BAR_BORDER="#362f2c"
POPUP_BG="#0f0c0a"
POPUP_BORDER="#362f2c"

# terminal ANSI slots (what ghostty emits; NOT always equal to the hue
# roles — e.g. cendre slot 0 is BG_ALT, slot 7 is FG_MUTED)
ANSI_0="#201b19"
ANSI_1="#d1766e"
ANSI_2="#99af6b"
ANSI_3="#fcba81"
ANSI_4="#58bdff"
ANSI_5="#9480ba"
ANSI_6="#4e89a2"
ANSI_7="#a09384"
ANSI_8="#73665b"
ANSI_9="#d25780"
ANSI_10="#43b16a"
ANSI_11="#f4a21c"
ANSI_12="#8bcfff"
ANSI_13="#a692cd"
ANSI_14="#20c9cb"
ANSI_15="#e6d5c2"

# pi UI surface tints (consumed by themify/build.sh when generating pi themes)
MIST="#c4b6a5"
BORDER_DIM="#362f2c"
SEARCH_BG="#3d2b23"
USER_MSG_BG="#211915"
CUSTOM_MSG_BG="#241d19"
TOOL_PENDING_BG="#1d1815"
TOOL_SUCCESS_BG="#1d2a1a"
TOOL_ERROR_BG="#2a1a16"
BGREEN="#43b16a"   # pi diff-added green (sora: hand-tuned darker than ANSI_10; cendre: == ANSI_10)
THINKING_OFF="#4a4038"
INFO_BG="#2a2016"
