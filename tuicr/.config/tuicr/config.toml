# tuicr — code review TUI (replaces hunk).
# Config reference: https://github.com/agavra/tuicr/blob/main/docs/CONFIG.md

# Built-in tokyo-night-storm (bg #24283b — folke's storm variant; night isn't
# bundled). Matches the desktop's chrome layer; zero color files in this repo.
theme = "tokyo-night-storm"

# Split (side-by-side) diff view instead of the default unified/inline
# (old left, new right). Toggle per-session with :diff in-app.
diff_view = "side-by-side"

# Flatten single-child directory chains in the file tree (e.g.
# app/src/main/kotlin/ + Editor.kt instead of 4 nested levels).
# NOT in 0.25.0 — added upstream post-0.25.0, ships in a future release.
# Uncomment when brew upgrades tuicr past it.
# compact_folders = true

# NOTE: no `editor` key — it doesn't exist in 0.25.0 (added upstream later;
# configuring unknown keys triggers a startup warning). 0.25.0's editor
# handoff falls back to $EDITOR, which .zshenv already sets to nvim — same
# behavior. Revisit if brew ships a newer tuicr.

# Vim keybindings inside the comment editor as well
comment_vim = true

# Match nvim: hybrid numbers while navigating diffs
relative_line_numbers = true
