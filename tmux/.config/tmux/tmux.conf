# Send keys to nvim/apps instantly — no delay before `jj`/<Esc> reaches the pane
# (tmux-sensible also sets this; explicit so the intent is visible without the plugin)
set -sg escape-time 0

unbind C-b
set -g prefix `
bind ` send-prefix

set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Keep manually-set window names; stop shell/programs from auto-renaming
set -g allow-rename off
set -g automatic-rename off

set -g focus-events on
set -g mouse on

set -g pane-border-lines single

# Reorder windows: `< and `> slide the current window left/right (repeatable)
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1

# ── Keybinds ───────────────────────────────────────────────────
# Reload this config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Splits keep the current directory: | = left/right, - = top/bottom
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Jump between panes with vim keys; Tab = last window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window

# Resize panes with Shift+vim keys, repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vi keys): [ enters, v selects; mouse-drag copies to clipboard ──
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ── Plugins (TPM) ──────────────────────────────────────────────
# `+I install, `+U update, `+alt-u remove unlisted
# Pin the plugin dir so TPM always finds plugins next to this config
# (~/.config/tmux/plugins/), regardless of how the server is started.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# Two PATH safeguards for servers started with an unusual environment:
# 1. If PATH is missing entirely (GUI/launchd), set a baseline.
# 2. If PATH exists but homebrew is not first, `#!/usr/bin/env bash` resolves to
#    /bin/bash 3.2, which has no associative arrays — the tokyo-night theme then
#    collapses every colour into the last one assigned (a single flat colour).
#    Prepend homebrew so plugin scripts always get bash 5.
if-shell '[ -z "$PATH" ]' "set-environment -g PATH '/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin'"
if-shell '[ "$(tmux show-environment -g PATH | cut -d= -f2 | cut -d: -f1)" != "/opt/homebrew/bin" ]' "set-environment -g PATH '/opt/homebrew/bin:/opt/homebrew/sbin:$PATH'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Keep resurrect saves under ~/.config/tmux too (default would recreate ~/.tmux)
set -g @resurrect-dir '~/.config/tmux/resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @continuum-restore 'on'

# janoamaral/tokyo-night-tmux via TPM, stock. The status bar is FIXED to
# tokyo-night "night" (a deliberate choice: it is not theme-switched). themify
# still recolors copy-mode selection and pane borders, which are subtle enough
# to harmonize with any theme; the bar itself stays night.
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @tokyo-night-tmux_theme "night"
set -g @tokyo-night-tmux_window_id_style "fsquare"
set -g @tokyo-night-tmux_pane_id_style "dsquare"
set -g @tokyo-night-tmux_transparent 0
set -g @tokyo-night-tmux_show_datetime 0
# Window tabs: λ instead of the >_ terminal glyph (U+EA85).
#
# KNOWN UPSTREAM BUG: tokyo-night-tmux parses these two options but never
# applies them — the terminal glyph is hardcoded in its window-status
# format strings. Documented in the plugin's user_docs but broken as of
# v1.0.0; reported upstream as janoamaral/tokyo-night-tmux#144 (open, no
# fix as of 2026-02). The actual replacement is done post-theme below.
# If the plugin fixes #144, these lines become effective as-is and the
# patch below should be removed (it is a no-op once the glyph is gone).
set -g @tokyo-night-tmux_terminal_icon "λ"
set -g @tokyo-night-tmux_active_terminal_icon "λ"

run '~/.config/tmux/plugins/tpm/tpm'

# tokyo-night paints the full status line; keep lengths generous
set -g status-left-length 100
set -g status-right-length 100

# Everything below runs after the theme so it wins.

# WORKAROUND for janoamaral/tokyo-night-tmux#144 (see note above): swap the
# hardcoded terminal glyph U+EA85 ( ) for λ (U+03BB) in the window-status
# formats the theme just painted. Read-modify-write, so the theme's colours
# and number styles stay dynamic; idempotent, so repeated reloads are safe.
# TODO(upstream): remove once #144 is fixed and shipped (a `+U update + check).
run 'tmux set -g window-status-current-format "$(tmux show -g window-status-current-format | cut -d\" -f2 | perl -CSD -pe "s/\x{EA85}/\x{3BB}/g")"'
run 'tmux set -g window-status-format "$(tmux show -g window-status-format | cut -d\" -f2 | perl -CSD -pe "s/\x{EA85}/\x{3BB}/g")"'

# Copy-mode selection (theme-switched by themify).
set -g mode-style "fg=#c8d0e0,bg=#1e2430"

# Pane borders: dim grid — inactive panes get BORDER, the active pane gets the
# theme ACCENT so it is obvious which pane has focus (theme-switched by themify).
set -g pane-border-style "fg=#2a3448"
set -g pane-active-border-style "fg=#80C8E0"

# Pane titles: leave off — tokyo-night-tmux already sets pane-border-status off.

# Let apps like pi receive modified keys (Shift+Enter, etc.)
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',*:extkeys'
