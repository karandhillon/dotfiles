# ── Prefix: ` (backtick) ───────────────────────────────────────────────────
unbind C-b
set -g prefix `
bind ` send-prefix

# ── Basics ─────────────────────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -sg escape-time 0               # Esc reaches nvim instantly
set -g focus-events on
set -g status-position top          # bottom stays free for nvim's statusline

# Keep manually-set window names; stop programs from renaming them
set -g allow-rename off
set -g automatic-rename off

# Let apps (nvim, Claude Code) receive modified keys (Shift+Enter, etc.)
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',*:extkeys'

# ── Keybinds ───────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Splits and new windows keep the current directory: | = side by side, - = stacked
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Panes: h/j/k/l move, H/J/K/L resize (repeatable); Tab = last window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind Tab last-window

# Windows: < and > slide the current window left/right (repeatable)
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1

# Copy mode (vi keys): [ enters, v selects, Ctrl-v toggles block selection
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ── Plugins (TPM): `+I install, `+U update, `+alt-u remove unlisted ───────
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'    # sane defaults (big history, longer messages, …)
set -g @plugin 'tmux-plugins/tmux-yank'        # copy to the macOS clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # …automatically
set -g @continuum-restore 'on'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'   # machine state, kept out of the repo

set -g @plugin 'janoamaral/tokyo-night-tmux'   # status bar — same palette as Ghostty + nvim
set -g @tokyo-night-tmux_theme "night"
set -g @tokyo-night-tmux_window_id_style "fsquare"
set -g @tokyo-night-tmux_pane_id_style "dsquare"
set -g @tokyo-night-tmux_transparent 0
set -g @tokyo-night-tmux_show_datetime 0

run '~/.config/tmux/plugins/tpm/tpm'

# ── After the theme (so these win) ─────────────────────────────────────────
set -g status-left-length 100
set -g status-right-length 100

# Selection + pane borders in tokyonight night colors
set -g mode-style "fg=#c0caf5,bg=#283457"
set -g pane-border-lines single
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
